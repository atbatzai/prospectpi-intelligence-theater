# ProspectPI Intelligence Theater - FRESH Development Environment
# Docker Compose configuration for clean containerized development

name: prospectpi-fresh-2025

services:
  # Backend API Service
  api:
    build:
      context: .
      target: development
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:prospectpi_fresh@postgres:5432/prospectpi_fresh
      - REDIS_URL=redis://redis:6379
      - THEIRSTACK_JWT=${THEIRSTACK_JWT}
      - MARKETAUX_TOKEN=${MARKETAUX_TOKEN}
      - CORESIGNAL_MCP_AUTH=${CORESIGNAL_MCP_AUTH}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prospectpi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - prospectpi-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=prospectpi_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=prospectpi_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Changed from 5432 to avoid conflict
    networks:
      - prospectpi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prospectpi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - prospectpi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx Reverse Proxy (Optional - for production-like setup)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - frontend
    networks:
      - prospectpi-network
    profiles:
      - production

networks:
  prospectpi-network:
    name: prospectpi-dev-network
    driver: bridge

volumes:
  postgres_data:
    name: prospectpi-dev-postgres
    driver: local
  redis_data:
    name: prospectpi-dev-redis
    driver: local